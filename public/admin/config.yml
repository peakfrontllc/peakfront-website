# Peakfront Project Admin (Decap CMS)
# Access at: https://yourdomain.com/admin
#
# SETUP (one-time):
# GitHub → Settings → Developer settings → OAuth Apps → New OAuth App
#   Homepage URL: https://www.peakfront.ae
#   Callback URL: https://www.peakfront.ae/api/auth/callback
# Then add GITHUB_OAUTH_CLIENT_ID and GITHUB_OAUTH_CLIENT_SECRET on Vercel and redeploy.
#
# SIMPLE LOCAL EDITING (no OAuth):
#   npx decap-server
#   Open http://localhost:3000/admin with local_backend: true uncommented below

backend:
  name: github
  repo: peakfrontllc/peakfront-website
  branch: main
  base_url: https://www.peakfront.ae
  auth_endpoint: api/auth

# Uncomment for local editing with `npx decap-server`:
# local_backend: true

media_folder: public/projects/images
public_folder: /projects/images

collections:
  - name: projects_list
    label: Project Portfolio
    files:
      - name: projects
        label: All Projects
        file: public/projects/projects.json
        fields:
          - label: Projects
            name: projects
            label_singular: Project
            widget: list
            summary: "{{fields.projectName}} — {{fields.completionDate}}"
            fields:
              - { label: ID (unique slug), name: id, widget: string, hint: "e.g. mussafah-yard-2026" }
              - { label: Project Name, name: projectName, widget: string }
              - { label: Client, name: client, widget: string }
              - { label: Main Contractor, name: mainContractor, widget: string }
              - { label: Scope of Work, name: scopeOfWork, widget: text }
              - label: Equipment Supplied
                name: equipment
                widget: list
                field: { label: Item, name: item, widget: string }
              - { label: Location, name: location, widget: string, required: false }
              - { label: Start Date, name: startDate, widget: string, hint: "e.g. Jan-25" }
              - { label: Completion Date, name: completionDate, widget: string, hint: 'Use "Running" for ongoing' }
              - label: Status
                name: status
                widget: select
                options: [ongoing, completed]
              - label: Project Photos
                name: images
                widget: list
                required: false
                hint: "Optional. Prefer dropping files in public/projects/images/{project-id}/ as 1.webp, 2.webp, etc."
                summary: "{{fields.src}}"
                fields:
                  - { label: Photo, name: src, widget: image }
                  - { label: Alt text, name: alt, widget: string, required: false }
